name: Bug report
description: Report a reproducible problem in AI Monitor
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping. Never attach tokens, auth files, profiles, or unsanitized logs."
  - type: input
    id: app-version
    attributes: {label: AI Monitor version, placeholder: "0.1.0 or commit SHA"}
    validations: {required: true}
  - type: input
    id: macos-version
    attributes: {label: macOS version, placeholder: "14.7.2"}
    validations: {required: true}
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [Codex, Mock, Kling Beta, Custom MCP, Not provider-specific]
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce, placeholder: "1. Open…\n2. Click…\n3. Observe…"}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual behavior}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Export from Settings → Advanced, review it, and paste only what is relevant.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed the text above and removed tokens, credentials, email addresses, private paths, and other secrets.
          required: true
        - label: I searched existing issues before opening this report.
          required: true
