name: Connection problem
description: Troubleshoot login, local process, or MCP connection failures
title: "[Connection]: "
labels: [bug]
body:
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [Codex, Custom MCP, Kling Beta, Other]
    validations: {required: true}
  - type: input
    id: app-version
    attributes: {label: AI Monitor version}
    validations: {required: true}
  - type: input
    id: macos-version
    attributes: {label: macOS version}
    validations: {required: true}
  - type: textarea
    id: state
    attributes: {label: Connection state and visible error, description: Copy the human-readable message, not credentials.}
    validations: {required: true}
  - type: textarea
    id: attempts
    attributes: {label: Troubleshooting already tried}
  - type: textarea
    id: logs
    attributes: {label: Reviewed sanitized diagnostics, description: Generate from Settings → Advanced and remove anything private., render: text}
  - type: checkboxes
    id: privacy
    attributes:
      label: Required confirmations
      options:
        - label: I did not include tokens, cookies, auth.json, Keychain values, profiles, or private keys.
          required: true
        - label: I understand Kling credit monitoring is not implemented without a verified official API.
          required: true
